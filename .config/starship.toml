"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory${env_var.fish_private_mode}$git_branch$git_status$git_state$cmd_duration$fill
$status$character"""

[character]
success_symbol = '[➜](bold green) '
error_symbol = '[✗](bold red) '

[cmd_duration]
format = '[·](#808080) [  $duration]($style) '

[env_var.fish_private_mode]
variable = 'fish_private_mode'
format = "[·](#808080) [\uf21b]($style) "
style = 'bold red'

[fill]
symbol = '·'
style = '#808080'

[git_branch]
format = '[·](#808080) [$symbol$branch(:$remote_branch)]($style) '

[git_status]
stashed = ''
style = 'bold yellow'

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = ''
