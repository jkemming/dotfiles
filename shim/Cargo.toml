[package]
name = "shim"
version = "0.1.0"
edition = "2024"
description = "Shims for git and sudo which are placed in front of the real commands on the PATH"

[dependencies]
libc = "0.2"
serde_json = "1"
signal-hook = "0.4"

[profile.release]
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
